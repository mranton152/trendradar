# Postgres — хранилище сырых данных и итоговой выдачи (ТЗ).
# Расчёт идёт на parquet; pg-load заливает золотой снапшот в базу при старте.
#   docker compose -f storage/compose.yml up -d
# Корневой docker-compose.yml подключает этот файл через include.
# Пути здесь относительно storage/ — так их разрешает и include, и -f.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trendradar
      POSTGRES_PASSWORD: trendradar
      POSTGRES_DB: trendradar
    ports:
      # 55432 снаружи: 5432 и 5433 на машинах команды заняты чужими проектами
      - "127.0.0.1:${TRENDRADAR_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendradar"]
      interval: 2s
      timeout: 3s
      retries: 20

  pg-load:
    build:
      context: ..
      dockerfile: storage/Dockerfile
    environment:
      TRENDRADAR_PG_DSN: postgresql://trendradar:trendradar@postgres:5432/trendradar
    volumes:
      - ../data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
