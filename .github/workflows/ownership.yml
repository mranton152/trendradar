name: границы ответственности

# Роняет PR, если человек залез в чужую папку. Это не про недоверие, а про то,
# что три LLM, правящие одни и те же файлы, гарантированно устроят кашу.

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить, чьи файлы затронуты
        run: |
          author="${{ github.event.pull_request.user.login }}"
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Автор: $author"
          echo "Изменено:"; echo "$files"

          # data/index/golden/ общий для всех троих: каждый кладёт туда свои
          # файлы (works и candidates от Кости, trends от Антона, cards от
          # Михаила). Границы там проходят по именам файлов, а не по папке.
          GOLDEN='^data/index/golden/'

          # Владельцы папок.
          case "$author" in
            # Антону принадлежат контракты, ядро и всё общее: зависимости,
            # сборка, CI. Правило «зависимости идут через Антона» — почему
            # uv.lock тоже здесь.
            mranton152)
              allowed="^(contracts|core|classifier|storage|validation|docs|team|spikes|\.githooks|\.github)/|^(AGENTS|CLAUDE|README)\.md$|^(Makefile|pyproject\.toml|uv\.lock|conftest\.py|\.gitignore)$|$GOLDEN" ;;
            DockerDun)
              allowed="^(ingest|semantic)/|$GOLDEN" ;;
            # docker-compose и .dockerignore в корне — часть задачи M-08,
            # поэтому входят в зону Михаила, хотя лежат не в его папке.
            quisinon-blip)
              allowed="^(cards|api|web)/|^(docker-compose\.yml|\.dockerignore)$|$GOLDEN" ;;
            *)      echo "::warning::неизвестный автор $author — проверка пропущена"; exit 0 ;;
          esac

          bad=$(echo "$files" | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "::error::PR трогает файлы вне зоны ответственности:"
            echo "$bad"
            echo "Откатите их: git checkout origin/${{ github.base_ref }} -- <файлы>"
            exit 1
          fi
          echo "✓ границы соблюдены"
