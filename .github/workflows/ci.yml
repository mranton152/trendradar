name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Настоящий Postgres: тесты storage/ проверяют загрузку, а не только DDL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trendradar
          POSTGRES_PASSWORD: trendradar
          POSTGRES_DB: trendradar
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U trendradar"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TRENDRADAR_PG_DSN: postgresql://trendradar:trendradar@localhost:55432/trendradar
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Поставить зависимости
        run: uv sync --all-extras

      - name: Линт
        run: uv run ruff check .

      - name: Тесты
        run: uv run pytest -q

      - name: Node для фронтенда
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка фронтенда
        # CI не собирал web/ вообще, поэтому сломанный импорт или ошибка типов
        # доезжали до main незамеченными. Сборка их ловит. Визуальные дефекты
        # она не ловит — на них по-прежнему нужен человек с браузером.
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Валидация контрактов на золотом снапшоте
        run: |
          set -e
          for pair in \
            "data/index/golden/works.parquet:works" \
            "data/index/golden/candidates.parquet:candidates" \
            "data/index/golden/cand_docs.parquet:cand_docs" \
            "data/index/golden/trends.parquet:trends" \
            "data/index/golden/cards.parquet:cards"; do
            f="${pair%%:*}"; s="${pair##*:}"
            if [ -f "$f" ]; then
              uv run python contracts/validate.py "$f" --schema "$s"
            else
              echo "· $f ещё нет — пропускаем"
            fi
          done
