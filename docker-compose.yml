include:
  - storage/compose.yml

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Без :ro — живой режим пишет data/live и data/index/live-*.
      - ./data:/app/data
    environment:
      # Ollama работает на хосте: перевод запроса и кандидаты-технологии.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      # Ключ OpenAlex необязателен: без него живой сбор пропускает историю
      # публикаций, фильтр зрелости работает анонимно. Берётся из .env.
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      API_URL: http://api:8000
    depends_on:
      - api
