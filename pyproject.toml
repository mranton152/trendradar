[project]
name = "trendradar"
version = "0.1.0"
description = "Сервис детекции зарождающихся научно-технологических трендов (ЛЦТ-2026)"
requires-python = ">=3.12"

dependencies = [
    # данные
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    # сеть
    "httpx>=0.27",
    "tenacity>=9.0",
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # экспорт и датасет заказчика
    "openpyxl>=3.1",
    # классификатор этапа 1
    "scikit-learn>=1.5",
    "psycopg[binary]>=3.2",
    "feedparser>=6.0,<7",
]

[project.optional-dependencies]
# Ставится только там, где реально считают эмбеддинги (машина Константина).
# На CI и слабых машинах не нужен: torch тяжёлый.
ml = [
    "sentence-transformers>=3.2",
    "umap-learn>=0.5.7",
    "hdbscan>=0.8.38",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# spikes/ — замороженный прототип, написанный до ТЗ. Он лежит в репозитории как
# доказательство того, что методология проверялась на реальных данных, и не
# переписывается: переписанный прототип перестаёт быть свидетельством.
exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# schemas.py — декларативная таблица полей. Комментарий у поля объясняет его
# смысл читателю контракта, и он важнее, чем уложиться в 100 символов.
"contracts/schemas.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["core", "ingest", "semantic", "cards", "api", "validation", "contracts", "classifier", "storage"]
python_files = ["test_*.py"]
